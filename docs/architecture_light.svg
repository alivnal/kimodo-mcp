<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs><rect width="880" height="600" rx="12" fill="#fcfcfb"/><rect x="300" y="20" width="280" height="62" rx="10" fill="#fcfcfb" stroke="#c9c8c3" stroke-width="1.5"/><text x="440.0" y="48.0" font-size="13" font-weight="600" text-anchor="middle"  fill="#0b0b0b">Claude session</text><text x="440.0" y="65.0" font-size="11.5" font-weight="400" text-anchor="middle"  fill="#52514e">Claude Code · Claude Desktop</text><path d="M440,82 L440,128" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#an)"/><text x="450" y="110" font-size="11.5" font-weight="400" text-anchor="start"  fill="#52514e">stdio</text><rect x="110" y="130" width="660" height="140" rx="10" fill="#f3f2ef" stroke="#c9c8c3" stroke-width="1.5" stroke-dasharray="5 4"/><text x="124" y="150" font-size="11.5" font-weight="600" text-anchor="start"  fill="#8a8984">kimodo MCP server · no torch, never holds the model</text><rect x="140" y="172" width="210" height="64" rx="10" fill="#fcfcfb" stroke="#c9c8c3" stroke-width="1.5"/><text x="245.0" y="201.0" font-size="13" font-weight="600" text-anchor="middle"  fill="#0b0b0b">10 tools</text><text x="245.0" y="218.0" font-size="11.5" font-weight="400" text-anchor="middle"  fill="#52514e">(+ retarget when configured)</text><polygon points="560,159.0 675.0,205 560,251.0 445.0,205" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="560" y="202" font-size="12" font-weight="600" text-anchor="middle"  fill="#0b0b0b">GPU guard</text><text x="560" y="218" font-size="11.5" font-weight="400" text-anchor="middle"  fill="#52514e">Kimodo already on the GPU?</text><path d="M350,204 L444,204" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#an)"/><path d="M675,205 L820,205 L820,51 L582,51" fill="none" stroke="#eb6834" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ao)"/><text x="804" y="122" font-size="11.5" font-weight="400" text-anchor="end"  fill="#eb6834">busy: refused</text><path d="M560,251 L560,318" fill="none" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#ab)"/><text x="572" y="294" font-size="11.5" font-weight="400" text-anchor="start"  fill="#2a78d6">free: start a detached job</text><rect x="110" y="320" width="660" height="140" rx="10" fill="#f3f2ef" stroke="#c9c8c3" stroke-width="1.5" stroke-dasharray="5 4"/><text x="124" y="340" font-size="11.5" font-weight="600" text-anchor="start"  fill="#8a8984">detached job · its own process, outlives the session</text><rect x="140" y="362" width="190" height="64" rx="10" fill="#fcfcfb" stroke="#c9c8c3" stroke-width="1.5"/><text x="235.0" y="391.0" font-size="13" font-weight="600" text-anchor="middle"  fill="#0b0b0b">runner</text><text x="235.0" y="408.0" font-size="11.5" font-weight="400" text-anchor="middle"  fill="#52514e">stores the exit code</text><rect x="430" y="350" width="220" height="46" rx="10" fill="#fcfcfb" stroke="#c9c8c3" stroke-width="1.5"/><text x="540.0" y="370.0" font-size="13" font-weight="600" text-anchor="middle"  fill="#0b0b0b">kimodo_batch.py</text><text x="540.0" y="387.0" font-size="11.5" font-weight="400" text-anchor="middle"  fill="#52514e">load → encode → clips</text><rect x="430" y="404" width="220" height="46" rx="10" fill="#fcfcfb" stroke="#c9c8c3" stroke-width="1.5"/><text x="540.0" y="424.0" font-size="13" font-weight="600" text-anchor="middle"  fill="#0b0b0b">kimodo_preview.py</text><text x="540.0" y="441.0" font-size="11.5" font-weight="400" text-anchor="middle"  fill="#52514e">Blender + ffmpeg</text><path d="M330,384 L380,384 L380,373 L428,373" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#an)"/><path d="M380,384 L380,427 L428,427" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#an)"/><rect x="140" y="510" width="360" height="64" rx="10" fill="#fcfcfb" stroke="#c9c8c3" stroke-width="1.5"/><text x="320.0" y="539.0" font-size="13" font-weight="600" text-anchor="middle"  fill="#0b0b0b">workspace outputs/</text><text x="320.0" y="556.0" font-size="11.5" font-weight="400" text-anchor="middle"  fill="#52514e">takes .npz · .mp4 · sheets · _logs · _mcp_jobs</text><rect x="600" y="510" width="170" height="64" rx="10" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/><text x="685.0" y="539.0" font-size="13" font-weight="600" text-anchor="middle"  fill="#0b0b0b">NVIDIA GPU</text><text x="685.0" y="556.0" font-size="11.5" font-weight="400" text-anchor="middle"  fill="#52514e">loaded per job, freed at exit</text><path d="M650,373 L700,373 L700,508" fill="none" stroke="#eb6834" stroke-width="1.6" marker-end="url(#ao)"/><path d="M540,450 L540,480 L420,480 L420,508" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#an)"/><path d="M140,220 L90,220 L90,542 L138,542" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#an)"/><text transform="rotate(-90 78 380)" x="78" y="380" font-size="11.5" font-weight="400" text-anchor="middle"  fill="#52514e">job · view · measure · list</text></svg>